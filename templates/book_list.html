<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f5f1;
            --text: #1c1c1a;
            --muted: #5f5f5a;
            --line: #dcdad2;
            --accent: #0f766e;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161715;
                --text: #f1f0ea;
                --muted: #a8a79f;
                --line: #33342f;
                --accent: #2dd4bf;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding: clamp(2rem, 6vw, 4rem) 1.5rem;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 44rem;
            margin: 0 auto;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        h1::after {
            content: "";
            display: block;
            width: 3.5rem;
            height: 4px;
            margin-top: 1rem;
            border-radius: 2px;
            background: var(--accent);
        }

        ul {
            margin-top: 2rem;
            padding: 0;
            list-style: none;
        }

        li {
            padding: 1.25rem 0;
            border-bottom: 1px solid var(--line);
        }

        li:first-child {
            padding-top: 0;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        li p {
            margin-top: 0.375rem;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .empty {
            margin-top: 2rem;
            color: var(--muted);
        }
    </style>
</head>
<body>

    <main>
        <h1>Books</h1>

        {% if books %}
            <ul>
                {% for book in books %}
                    <li>
                        <h2>{{ book.name }}</h2>
                        <p>{{ book.about|linebreaksbr }}</p>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="empty">No books yet.</p>
        {% endif %}
    </main>

</body>
</html>
